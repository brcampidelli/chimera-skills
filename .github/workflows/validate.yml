name: validate

# pull_request only: a fork's code runs with a read-only token and no secrets.
# pull_request_target is refused in this repository (it would hand a fork the base repo's token).
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pinned validators
        run: python -m pip install --disable-pip-version-check "pyyaml==6.0.3" "chimera-agent==0.68.1"
      - name: Validate catalogue
        run: python -I scripts/check.py --require-chimera
